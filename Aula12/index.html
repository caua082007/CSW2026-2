<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 12</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> <u>Aula 12</u> </h1>
    <br>
    <h3><a href="page02.html">próxima página</a></h3>
    <br>

    <h2>Atividade Flexbox</h2>

    <h4><u>flex-start:</u></h4>
    <div class="container" style="justify-content: flex-start;">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <h4><u>flex-end:</u></h4>
    <div class="container" style="justify-content: flex-end;">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <h4><u>center:</u></h4>
    <div class="container" style="justify-content: center;">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <h4><u>space-between:</u></h4>
    <div class="container" style="justify-content: space-between;">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <h4><u>space-around:</u></h4>
    <div class="container" style="justify-content: space-around;">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <br><br>

    
    <div style="display: flex; flex-direction: row; gap: 40px;">


        <div>
            <h4 style="margin-bottom: 5px;"><u>flex-start:</u></h4>
            <div class="container2" style="align-items: flex-start; height: 300px;">
                <div class="item"></div>
                <div class="item" style="height: 170px;"></div>
                <div class="item" style="height: 100px;"></div>
            </div>
        </div>

        
        <div>
            <h4 style="margin-bottom: 5px;"><u>flex-center:</u></h4>
            <div class="container2" style="align-items: center; height: 300px;">
                <div class="item"></div>
                <div class="item" style="height: 170px;"></div>
                <div class="item" style="height: 100px;"></div>
            </div>
        </div>
       
      
        <div>
            <h4 style="margin-bottom: 5px;"><u>stretch:</u></h4>
            <div class="container2" style="align-items: stretch; height: 300px;">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>

        <div>
            <h4 style="margin-bottom: 5px;"><u>flex-end:</u></h4>
            <div class="container2" style="align-items: flex-end; height: 300px;">
                <div class="item"></div>
                <div class="item" style="height: 170px;"></div>
                <div class="item" style="height: 100px;"></div>
            </div>
        </div>

    </div>
    
</body>
</html>
